name: surebet-monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      filter_id:
        description: "Optional filter id from filters.json"
        required: false
        type: string
      debug:
        description: "Enable debug screenshots"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run (no Telegram / no sent-state updates)"
        required: false
        type: boolean
        default: false

concurrency:
  group: surebet-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch bot-state
        continue-on-error: true
        run: |
          git fetch origin bot-state:bot-state || true
          if git show-ref --verify --quiet refs/heads/bot-state; then
            git show bot-state:state.json > data/state.json || echo '{"opportunities":[],"error_alerts":{}}' > data/state.json
          else
            echo '{"opportunities":[],"error_alerts":{}}' > data/state.json
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q
        env:
          PYTHONPATH: .

      - name: Restore storage_state from secret
        env:
          SUREBET_STORAGE_STATE_B64: ${{ secrets.SUREBET_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$SUREBET_STORAGE_STATE_B64" ]; then
            echo "No SUREBET_STORAGE_STATE_B64 secret — will try password login (may fail on reCAPTCHA)"
            exit 0
          fi
          python - <<'PY'
          import base64, os
          raw = base64.b64decode(os.environ["SUREBET_STORAGE_STATE_B64"])
          open("storage_state.json", "wb").write(raw)
          print(f"Wrote storage_state.json ({len(raw)} bytes)")
          PY

      - name: Run monitor
        env:
          PYTHONPATH: .
          SUREBET_USERNAME: ${{ secrets.SUREBET_USERNAME }}
          SUREBET_PASSWORD: ${{ secrets.SUREBET_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          SUREBET_BASE_URL: https://pt.surebet.com
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          if [ -n "${{ github.event.inputs.filter_id }}" ]; then ARGS="$ARGS --filter ${{ github.event.inputs.filter_id }}"; fi
          if [ -f storage_state.json ]; then
            export SUREBET_STORAGE_STATE_PATH=storage_state.json
          fi
          python main.py $ARGS

      - name: Publish bot-state
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          if [ ! -f data/state.json ]; then
            echo "No state.json; skip"
            exit 0
          fi
          git config user.name "surebet-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan bot-state-tmp
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p .
          cp data/state.json state.json
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "bot-state update [skip ci]"
          git branch -M bot-state
          git push -f origin bot-state
