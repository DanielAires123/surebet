name: surebet-callbacks

# Drain Apostei/Não button presses between monitor runs.
on:
  # UTC. Touching this cron re-registers the schedule with GitHub.
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

concurrency:
  group: surebet-callbacks
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch bot-state
        continue-on-error: true
        run: |
          mkdir -p data
          git fetch origin bot-state:bot-state || true
          if git show-ref --verify --quiet refs/heads/bot-state; then
            git show bot-state:state.json > data/state.json || echo '{"opportunities":[],"error_alerts":{},"pending_alerts":{},"bets":{},"telegram_update_offset":0}' > data/state.json
          else
            echo '{"opportunities":[],"error_alerts":{},"pending_alerts":{},"bets":{},"telegram_update_offset":0}' > data/state.json
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Poll Telegram callbacks
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --poll-callbacks

      - name: Publish bot-state
        if: success()
        run: |
          if [ ! -f data/state.json ]; then
            echo "No state.json; skip"
            exit 0
          fi
          git config user.name "surebet-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan bot-state-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp data/state.json state.json
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "bot-state callbacks [skip ci]"
          git branch -M bot-state
          git push -f origin bot-state
